name: Update data

on:
  schedule:
    - cron: "30 23 * * 1-5"   # weekdays, after the oil futures settle
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install yfinance pandas
      - name: Fetch latest prices
        run: python tools/update_seed.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seed
          git diff --cached --quiet || (git commit -m "Update price data" && git push)
